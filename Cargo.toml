[workspace]
resolver = "3"
members = [
  "crates/nyx-auth-core",
  "crates/nyx-auth-proto",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Ken Smith"]
repository = "https://github.com/design-nexus/nyx-biometrics"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.9"
thiserror = "2"
zbus = { version = "5", default-features = false, features = ["tokio"] }

[profile.release]
lto = "thin"
strip = true
