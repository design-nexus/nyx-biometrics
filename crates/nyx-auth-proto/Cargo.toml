[package]
name = "nyx-auth-proto"
description = "D-Bus interface and client for the Nyx authentication broker"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
client = ["dep:zbus", "dep:libc"]

[dependencies]
nyx-auth-core = { path = "../nyx-auth-core", features = ["dbus"] }
serde.workspace = true
zvariant = "5"
serde_json = "1"
zbus = { workspace = true, optional = true }
libc = { version = "0.2", optional = true }
