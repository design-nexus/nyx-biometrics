[package]
name = "nyx-auth-pam"
description = "PAM stack generation, parsing and checks for Nyx Biometrics"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
nyx-auth-core = { path = "../nyx-auth-core" }
nyx-auth-hw = { path = "../nyx-auth-hw" }
thiserror.workspace = true
serde_json = "1"
libc = "0.2"

[[bin]]
name = "nyx-auth-gate"
path = "src/bin/nyx-auth-gate.rs"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "pam-try"
path = "src/bin/pam-try.rs"
test = false

[[bin]]
name = "nyx-auth-notify"
path = "src/bin/nyx-auth-notify.rs"
