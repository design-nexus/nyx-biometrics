[package]
name = "nyx-authd"
description = "The Nyx authentication broker: Nyx apps ask it to confirm the person before sensitive actions"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
nyx-auth-core = { path = "../nyx-auth-core" }
nyx-auth-proto = { path = "../nyx-auth-proto", features = ["client"] }
zbus.workspace = true
tokio = { version = "1", features = ["rt", "macros", "process", "time", "sync", "signal"] }
futures-util = "0.3"
serde_json = "1"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
